<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoodWe Pakistan Warranty Claim</title>
<meta name="theme-color" content="#0A0A0A">
<style>
  html, body { margin: 0; height: 100%; background: #0A0A0A; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Customer claim portal. The app itself runs on Google Apps Script. -->
<iframe id="app" title="GoodWe Pakistan Warranty Claim" allow="camera; clipboard-write; fullscreen"></iframe>
<script>
  // Apps Script web app (keep this the same deployment; "Manage deployments > Edit > New version" keeps the URL)
  var APP = 'https://script.google.com/macros/s/AKfycbyW4RENhadAPgwpvXS8L5QxHhcusdLFCfK8t7CJ_HQF6KvH2dY_GGk4Jjn0ipUEKjaj/exec';
  // /staff or ?staff opens the staff login
  var staff = /(^|\/)staff\/?$/.test(location.pathname) || /[?&]staff\b/.test(location.search);
  document.getElementById('app').src = APP + (staff ? '?staff' : '');
</script>
</body>
</html>
